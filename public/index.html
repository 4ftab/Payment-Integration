<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>Payment System</title>

<style>

body {
    margin: 0;
    background: #f4f6fa;
    color: #1c2333;
    font-family: Arial, sans-serif;
}

main {
    max-width: 800px;
    margin: auto;
    padding: 30px 20px;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #666;
    margin-bottom: 25px;
}

.card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 15px;
}

.customer {
    font-size: 18px;
    font-weight: bold;
}

.email {
    color: #777;
    margin-bottom: 15px;
}

.info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 15px;
}

.label {
    color: #777;
    font-size: 13px;
}

.value {
    font-weight: bold;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #2f6bff;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

.status {
    display: inline-block;
    margin-bottom: 15px;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.pending {
    background: #fff4d6;
    color: #9a6700;
}

.paid {
    background: #e3f6ee;
    color: #12805c;
}

.error {
    background: #fde8e6;
    color: #b42318;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
}

.empty {
    color: #777;
}

</style>

</head>


<body>

<main>

<h1>Customer Orders</h1>

<p class="subtitle">
Select an order to make its payment.
</p>

<div id="message"></div>

<div id="orders">
    Loading orders...
</div>

</main>


<script>

async function loadOrders() {

    const container =
        document.getElementById("orders");

    try {

        const response =
            await fetch("/orders");

        const orders =
            await response.json();


        if (!response.ok) {

            throw new Error(
                orders.error || "Could not load orders"
            );
        }


        container.innerHTML = "";


        if (orders.length === 0) {

            container.innerHTML =
                '<p class="empty">No orders found.</p>';

            return;
        }


        orders.forEach(order => {

            const card =
                document.createElement("div");

            card.className = "card";


            const status =
                String(order.Status).toLowerCase();


            card.innerHTML = `

                <div class="customer">
                    ${order.customer_name}
                </div>

                <div class="email">
                    ${order.customer_email}
                </div>

                <div class="status ${status}">
                    ${order.Status}
                </div>

                <div class="info">

                    <div>
                        <div class="label">
                            Order ID
                        </div>

                        <div class="value">
                            ${order.order_id}
                        </div>
                    </div>


                    <div>
                        <div class="label">
                            Customer ID
                        </div>

                        <div class="value">
                            ${order.Customer_Id}
                        </div>
                    </div>


                    <div>
                        <div class="label">
                            Amount
                        </div>

                        <div class="value">
                            PKR ${Number(order.Amount).toLocaleString()}
                        </div>
                    </div>


                    <div>
                        <div class="label">
                            Created
                        </div>

                        <div class="value">
                            ${order.Created_At || "-"}
                        </div>
                    </div>

                </div>


                ${
                    status === "pending"
                    ?
                    `<button onclick="payOrder(${order.order_id}, this)">
                        Pay Now
                    </button>`
                    :
                    `<button disabled>
                        Already Paid
                    </button>`
                }

            `;


            container.appendChild(card);

        });


    } catch (error) {

        container.innerHTML = `
            <div class="error">
                ${error.message}
            </div>
        `;

    }

}


async function payOrder(orderId, button) {

    button.disabled = true;

    button.textContent =
        "Creating payment...";


    try {

        const response =
            await fetch("/payments", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    order_id: orderId
                })

            });


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.details ||
                data.error ||
                "Payment creation failed"
            );

        }


        console.log(
            "Payment created:",
            data
        );


        // Send customer to Safepay checkout

        window.location.href =
            data.checkoutUrl;


    } catch (error) {

        document.getElementById("message").innerHTML = `
            <div class="error">
                ${error.message}
            </div>
        `;


        button.disabled = false;

        button.textContent =
            "Pay Now";

    }

}


loadOrders();

</script>

</body>

</html>
